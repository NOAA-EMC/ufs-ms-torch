[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufs-ms-torch"
version = "0.1.0"
description = "MPAS-Atmosphere dynamics coupled to the GFS v17 CCPP physics, in PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "PERMISSIONS.md", "NOTICE"]
authors = [{ name = "IC Weather LLC" }]
dependencies = [
    "torch==2.8.*",
    "numpy==2.0.*",
    "netCDF4>=1.7,<1.8",
    "f90nml>=1.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noahmp_land_surface_torch = ["data/*/*.tbl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
